[workspace]
resolver = "3"
members = ["crates/*", "apps/gnome"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/baxyz/pigeonnier"
authors = ["baxyz <berenger@arnaud.work>"]
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
pigeonnier-core = { path = "crates/pigeonnier-core" }
relm4 = { version = "0.11", default-features = false, features = ["libadwaita", "gnome_46"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
toml = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
wiremock = "0.6"
zbus = "6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

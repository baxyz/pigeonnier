# cargo-deny: licenses and advisories. Only AGPL-compatible licenses are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Published on 2026-11-20: chrono is unmaintained, with no known flaw. Moving to jiff touches
  # every date of the engine, so it is its own change.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known flaw; jiff later" },
]

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-24.04
    # Debian 13 has the libadwaita 1.7 the app needs, like the devcontainer; Ubuntu 24.04 has 1.5.
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v7
      - name: GTK and libadwaita
        run: apt-get update && apt-get install -y --no-install-recommends libadwaita-1-dev libgtk-4-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: GTK and libadwaita
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libadwaita-1-dev libgtk-4-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check

  extension:
    name: GNOME Shell extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: node --test extensions/gnome/
      - name: The Shell file parses
        run: cp extensions/gnome/extension.js /tmp/extension.mjs && node --check /tmp/extension.mjs
